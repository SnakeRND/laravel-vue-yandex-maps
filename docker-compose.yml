services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      APP_NAME: "Maps Reviews"
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-demo@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-password}
      SEED_USER_NAME: ${SEED_USER_NAME:-Demo User}
      YANDEX_BASE_URL: ${YANDEX_BASE_URL:-https://yandex.com}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8080,127.0.0.1,127.0.0.1:8080}
    volumes:
      - sqlite_data:/data
    command: ["app"]

  queue:
    build: .
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      YANDEX_BASE_URL: ${YANDEX_BASE_URL:-https://yandex.com}
    volumes:
      - sqlite_data:/data
    command: ["queue"]
    depends_on:
      - app

volumes:
  sqlite_data:
