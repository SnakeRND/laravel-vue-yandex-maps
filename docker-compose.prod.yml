# Production overrides: no public DB port, debug off.
services:
  app:
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}

  queue:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}

  # db: порт наружу не публикуем
